name: Skill scan

# Supply-chain gate for the org marketplace. Every plugin that changes in a PR
# is scanned by NVIDIA SkillSpector before it can reach main.
#
#   exit 0 -> risk_score <= 50 (SAFE / CAUTION)   -> pass, auto-merge armed
#   exit 1 -> risk_score >  50 (DO_NOT_INSTALL)   -> block
#   exit 2 -> scanner error                        -> block (fail closed)
#
# Findings go to the job summary and a retained artifact. SARIF upload to
# Security -> Code scanning is opt-in; see SKILLSPECTOR_UPLOAD_SARIF below.
# Guidance: https://owasp.org/www-project-agentic-skills-top-10/skill-scanner-integration

on:
  # Deliberately NO `paths:` filter, on either event.
  #
  # `Gate` is the required status check. A workflow skipped by path filtering
  # never reports its checks - GitHub leaves them "Expected - waiting for status
  # to be reported" and the pull request can never merge. With a filter here, a
  # PR touching only docs/, README.md, CODEOWNERS or scripts/ would be blocked
  # forever.
  #
  # So the workflow always runs and `discover` short-circuits when no plugin
  # changed: `any=false`, the scan matrix is skipped, and Gate treats that as a
  # pass. It costs about twenty seconds on an unrelated PR and removes a whole
  # class of filter-drift bugs, including the previous requirement that the two
  # events' path lists be kept in sync by hand.
  pull_request:
  push:
    branches: [main]

  # On-demand run, for verifying a gate change without pushing a dummy commit.
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions: {}

concurrency:
  group: skill-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned release. Bumping this is a security-reviewed change - see CODEOWNERS.
  # Must match scanner-health.yml; the `Scanner pin` step below enforces that.
  SKILLSPECTOR_VERSION: v2.11.0

  # Reference validator for the Agent Skills spec. Pinned exactly: this is a
  # 0.1.x package, so a minor bump can legitimately change what counts as valid.
  SKILLS_REF_VERSION: 0.1.1

jobs:
  discover:
    name: Discover changed plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # docs/SECURITY.md lists "pinned scanner version, identical in both
      # workflows" as a control. A comment asking for that is not a control;
      # this is. Bumping one pin without the other means the gate and its own
      # health check are testing different scanners.
      - name: Tool pins match scanner-health
        run: |
          set -euo pipefail
          pin() { awk -v k="^  $2:" '$0 ~ k {print $2; exit}' "$1"; }
          fail=0
          for key in SKILLSPECTOR_VERSION SKILLS_REF_VERSION; do
            gate=$(pin .github/workflows/skill-scan.yml   "$key")
            health=$(pin .github/workflows/scanner-health.yml "$key")
            if [ -z "$gate" ] || [ -z "$health" ]; then
              echo "::error title=Cannot read pin::Failed to parse ${key} from one of the workflows."
              fail=1
              continue
            fi
            if [ "$gate" != "$health" ]; then
              echo "::error title=Pin mismatch::skill-scan.yml pins ${key}=${gate} but scanner-health.yml pins ${health}. The gate and its health check must use the same tools."
              fail=1
              continue
            fi
            echo "Both workflows pin ${key}=${gate}."
          done
          exit "$fail"

      - id: list
        name: List plugins to scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Only what this PR touches: added, copied, modified, renamed.
            # NOT `|| true` - a diff that fails (unfetched base, force-push
            # race) would otherwise look identical to a PR that changed no
            # plugin, and we would scan nothing while reporting a pass.
            if ! changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- plugins/); then
              echo "::error title=Cannot determine changed plugins::git diff ${BASE_SHA}..${HEAD_SHA} failed. Failing closed rather than scanning nothing."
              exit 1
            fi
          else
            changed=$(find plugins -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true)
          fi

          # plugins/<name>/... -> <name>
          #
          # The trailing `|| true` is load-bearing: grep exits 1 when nothing
          # matches, and under `pipefail` that killed the step before the
          # empty-set branch below could run. That made a marketplace-only,
          # workflow-only or plugin-deleting PR fail with an empty log.
          names=$(printf '%s\n' "$changed" \
            | grep -oE '^plugins/[^/]+' \
            | sed 's|^plugins/||' \
            | sort -u || true)

          if [ -z "$names" ]; then
            echo "plugins=[]" >> "$GITHUB_OUTPUT"
            echo "any=false"  >> "$GITHUB_OUTPUT"
            echo "No plugin changes; nothing to scan. The scan matrix is skipped and Gate passes."
            exit 0
          fi

          json=$(printf '%s\n' "$names" | jq -R . | jq -sc .)
          echo "plugins=$json" >> "$GITHUB_OUTPUT"
          echo "any=true"      >> "$GITHUB_OUTPUT"
          echo "Will scan: $json"

  validate:
    # Format gate, distinct from the security gate. SkillSpector judges whether a
    # skill is dangerous; it does not check that SKILL.md is well-formed. A skill
    # with a malformed frontmatter, a name that disagrees with its directory, or
    # a field the spec does not allow scans clean and then fails on every
    # engineer's machine at install time - or silently never loads.
    #
    # Uses the spec's own reference implementation, so "valid" means what
    # agentskills.io says it means rather than what we think it means.
    name: Validate skill format
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install skills-ref ${{ env.SKILLS_REF_VERSION }}
        run: |
          set -euo pipefail
          pipx install "skills-ref==${SKILLS_REF_VERSION}"
          # The PyPI distribution is named `skills-ref` but installs a console
          # script called `agentskills`. The upstream README documents
          # `skills-ref validate`, which does not exist in the published wheel.
          agentskills --version

      - name: Validate every skill in the changed plugins
        env:
          PLUGINS: ${{ needs.discover.outputs.plugins }}
        run: |
          set -uo pipefail
          fail=0
          checked=0

          for plugin in $(printf '%s' "$PLUGINS" | jq -r '.[]'); do
            dir="plugins/${plugin}/skills"
            if [ ! -d "$dir" ]; then
              echo "::notice title=No skills directory::plugins/${plugin} has no skills/ directory. Nothing to validate."
              continue
            fi

            found=0
            for skill in "$dir"/*/; do
              [ -f "${skill}SKILL.md" ] || continue
              found=1
              checked=$((checked + 1))
              code=0
              out=$(agentskills validate "${skill%/}" 2>&1) || code=$?
              case "$code" in
                0) echo "ok      ${skill%/}" ;;
                1) echo "::error title=Invalid skill::${skill%/} does not conform to the Agent Skills spec."
                   printf '%s\n' "$out"
                   fail=1 ;;
                # `validate` documents only 0 and 1, but returns 2 for an
                # unreadable path. Treat every other code as a failure to
                # validate, which is not the same as a pass.
                *) echo "::error title=Validator errored::agentskills exited ${code} on ${skill%/}. Failing closed."
                   printf '%s\n' "$out"
                   fail=1 ;;
              esac
            done

            if [ "$found" -eq 0 ]; then
              echo "::notice title=No skills found::plugins/${plugin}/skills contains no SKILL.md."
            fi
          done

          echo "Validated ${checked} skill(s) against agentskills.io."
          exit "$fail"

  scan:
    name: Scan ${{ matrix.plugin }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Job `permissions:` cannot be conditional, so this is granted even though
      # the SARIF upload is off by default. It is only exercised when
      # SKILLSPECTOR_UPLOAD_SARIF is 'true'; keeping it here means enabling code
      # scanning stays a repository-settings change rather than a workflow edit.
      security-events: write
      id-token: write          # only used when the bedrock provider is configured
    strategy:
      fail-fast: false          # scan every plugin, report all findings at once
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SkillSpector ${{ env.SKILLSPECTOR_VERSION }}
        run: |
          set -euo pipefail
          pipx install \
            "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@${SKILLSPECTOR_VERSION}"
          skillspector --version

      # Only runs when SKILLSPECTOR_BEDROCK_ROLE_ARN is set, i.e. when an adopter
      # has chosen the bedrock provider. Inert otherwise.
      - name: Assume Bedrock role (OIDC)
        id: aws
        if: >-
          vars.SKILLSPECTOR_BEDROCK_ROLE_ARN != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SKILLSPECTOR_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: skillspector-${{ github.run_id }}

      - name: Scan
        id: scan
        env:
          PLUGIN: ${{ matrix.plugin }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          UPLOAD_SARIF: ${{ vars.SKILLSPECTOR_UPLOAD_SARIF }}

          # Provider-agnostic pass-through. Set SKILLSPECTOR_PROVIDER as a repo
          # variable and supply only that provider's credentials; the rest stay
          # empty and are ignored. Variable names are those SkillSpector v2.11.0
          # actually reads - see docs/skill-policy.md for the full matrix.
          SKILLSPECTOR_PROVIDER: ${{ vars.SKILLSPECTOR_PROVIDER || 'openai_compatible' }}
          SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL }}
          # Declares token budgets for models absent from the provider's bundled
          # registry. Without it SkillSpector assumes a 128k window, which can
          # truncate a large skill mid-analysis and quietly reduce coverage.
          SKILLSPECTOR_MODEL_REGISTRY: ${{ github.workspace }}/.github/skillspector-model-registry.yaml

          # openai_compatible - any OpenAI-protocol endpoint (Gemini, Groq,
          # Together, Mistral, self-hosted). No default base URL on purpose: a
          # baked-in one silently sends your skills to that vendor when an
          # adopter sets the provider but forgets the URL.
          SKILLSPECTOR_COMPAT_API_KEY: ${{ secrets.SKILLSPECTOR_COMPAT_API_KEY }}
          SKILLSPECTOR_COMPAT_BASE_URL: ${{ vars.SKILLSPECTOR_COMPAT_BASE_URL }}
          # openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_PROJECT_ID: ${{ vars.OPENAI_PROJECT_ID }}
          # anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          # anthropic_proxy
          ANTHROPIC_PROXY_API_KEY: ${{ secrets.ANTHROPIC_PROXY_API_KEY }}
          ANTHROPIC_PROXY_ENDPOINT_URL: ${{ vars.ANTHROPIC_PROXY_ENDPOINT_URL }}
          # azure_openai
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          # nv_build
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
          # ollama (self-hosted; needs a runner that can reach it)
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
        run: |
          set -uo pipefail
          target="plugins/${PLUGIN}"

          # Enable the semantic pass if ANY provider credential arrived. Fork PRs
          # cannot read secrets, so they legitimately run static-only. A missing
          # semantic pass must never mean a missing gate: the exit-code policy
          # below still runs and still blocks.
          creds="${SKILLSPECTOR_COMPAT_API_KEY:-}${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}"
          creds="${creds}${ANTHROPIC_PROXY_API_KEY:-}${AZURE_OPENAI_API_KEY:-}${NVIDIA_INFERENCE_KEY:-}"
          creds="${creds}${OLLAMA_BASE_URL:-}"
          [ "${AWS_OUTCOME:-}" = "success" ] && creds="${creds}bedrock"

          # Half-configured openai_compatible is a misconfiguration, not a
          # fallback: the key is present but there is nowhere to send it.
          if [ "$SKILLSPECTOR_PROVIDER" = "openai_compatible" ] \
             && [ -n "${SKILLSPECTOR_COMPAT_API_KEY:-}" ] \
             && [ -z "${SKILLSPECTOR_COMPAT_BASE_URL:-}" ]; then
            echo "::error title=Incomplete provider config::SKILLSPECTOR_COMPAT_API_KEY is set but SKILLSPECTOR_COMPAT_BASE_URL is not. Set the endpoint variable, or unset the key to run static-only."
            exit 1
          fi

          llm_flag="--no-llm"
          if [ -n "$creds" ]; then
            llm_flag=""
            echo "LLM semantic analysis: enabled (provider=${SKILLSPECTOR_PROVIDER} model=${SKILLSPECTOR_MODEL:-provider default})"
          else
            echo "LLM semantic analysis: disabled (no credentials for provider=${SKILLSPECTOR_PROVIDER}) - static analysis only"
          fi

          baseline=""
          if [ -f .skillspector-baseline.yaml ]; then
            baseline="--baseline .skillspector-baseline.yaml"
            echo "Baseline suppressions: .skillspector-baseline.yaml"
          fi

          # ONE authoritative scan. The markdown report and the enforced exit
          # code come from the same invocation, so the summary a reviewer reads
          # can never disagree with the verdict - which it could when this ran
          # the scan twice and the semantic pass returned a different score.
          #
          # GitHub's default shell is `bash -e`; `set +o errexit` above does not
          # survive that, and a plain `cmd; code=$?` dies before the assignment.
          # `|| code=$?` is checked context, so errexit stays suppressed.
          code=0
          skillspector scan "$target" $llm_flag $baseline \
            --format markdown -o "skillspector.md" || code=$?

          # SARIF costs a second full scan (and, with the semantic pass on, a
          # second set of model calls), so it is produced only when the upload
          # is actually enabled. Its exit code is deliberately ignored: the run
          # above is the verdict.
          if [ "${UPLOAD_SARIF:-}" = "true" ]; then
            echo "SARIF: enabled - running a second scan for code scanning."
            skillspector scan "$target" $llm_flag $baseline \
              --format sarif -o "skillspector.sarif" || true
          else
            echo "SARIF: disabled (set the SKILLSPECTOR_UPLOAD_SARIF variable to 'true' to enable)."
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## SkillSpector: \`${PLUGIN}\`"
            echo
            cat skillspector.md 2>/dev/null || echo "_No markdown report produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        # OFF BY DEFAULT. Code scanning needs GitHub Advanced Security on a
        # private repo, so for most adopters this step could only ever 403. The
        # verdict, job summary and retained artifact do not depend on it.
        # Enable with a repository variable:
        #
        #   gh variable set SKILLSPECTOR_UPLOAD_SARIF --body true
        #
        # Still skipped for FORK PRs, which cannot write security events. The
        # `github.event_name != 'pull_request'` arm matters because head.repo is
        # empty on `push`, which would otherwise skip every upload on main.
        #
        # continue-on-error: a missing reporting surface is not a security
        # failure. See docs/SECURITY.md.
        if: >-
          always() &&
          vars.SKILLSPECTOR_UPLOAD_SARIF == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: skillspector.sarif
          category: skillspector-${{ matrix.plugin }}

      - name: Retain report (audit log)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-${{ matrix.plugin }}
          # skillspector.sarif only exists when SARIF is enabled; the markdown
          # report is always the audit record.
          path: |
            skillspector.md
            skillspector.sarif
          retention-days: 90
          if-no-files-found: error   # the report is the audit record; absence is a failure

      - name: Enforce policy
        # `always()` so that a failure in the artifact step above cannot swallow
        # the real reason the job failed. Without it a scanner error surfaced to
        # the developer as "no files found" from an upload action.
        if: always()
        env:
          CODE: ${{ steps.scan.outputs.exit_code }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          case "${CODE:-}" in
            0) echo "PASS: ${PLUGIN} scored SAFE or CAUTION (risk_score <= 50)." ;;
            1) echo "::error title=Skill scan blocked::${PLUGIN} scored DO_NOT_INSTALL (risk_score > 50). See the job summary or the skillspector-${PLUGIN} artifact."
               exit 1 ;;
            # Includes the empty case: if the scan step never set an exit code it
            # did not complete, and an unscanned plugin is not a passing plugin.
            *) echo "::error title=Skill scan errored::SkillSpector exited '${CODE:-<none>}' on ${PLUGIN}. Failing closed."
               exit 1 ;;
          esac

  gate:
    # Single fixed-name check for branch protection to require. The scan jobs are
    # a matrix, so their names vary with the plugin set - requiring them by name
    # would silently not cover a newly added plugin. This job's name never
    # changes, so it covers every plugin for all time.
    #
    # Because the workflow has no `paths:` filter, this check reports on EVERY
    # pull request, which is what makes it safe to mark required.
    #
    # Scanner health is checked by scanner-health.yml, deliberately off the PR
    # path: it validates the tool, not the change, and would otherwise put a
    # check about a fake malicious plugin on every unrelated PR. It is therefore
    # NOT one of this job's dependencies.
    name: Gate
    needs: [discover, validate, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require discovery, format validation and every plugin scan to have passed
        env:
          DISCOVER: ${{ needs.discover.result }}
          VALIDATE: ${{ needs.validate.result }}
          SCAN: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          echo "discover=$DISCOVER  validate=$VALIDATE  scan=$SCAN"

          fail=0
          [ "$DISCOVER" = "success" ] || { echo "::error::discover did not succeed ($DISCOVER)"; fail=1; }
          # 'skipped' is legitimate for both: a PR touching no plugin has nothing
          # to validate and nothing to scan. `discover` having succeeded is what
          # makes that trustworthy - it fails closed rather than reporting an
          # empty set it could not compute.
          case "$VALIDATE" in
            success|skipped) ;;
            *) echo "::error::skill format validation did not pass ($VALIDATE)"; fail=1 ;;
          esac
          case "$SCAN" in
            success|skipped) ;;
            *) echo "::error::one or more plugin scans did not pass ($SCAN)"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] && echo "Gate passed." || exit 1

  automerge:
    name: Arm auto-merge
    needs: [gate]
    # `scan` is legitimately skipped when a PR touches no plugin (e.g. marketplace
    # metadata only), so 'skipped' is a pass here.
    if: >-
      github.event_name == 'pull_request' &&
      needs.gate.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This ARMS GitHub auto-merge; it does not bypass anything. The PR still
      # merges only once branch protection is satisfied - which for this repo
      # means CODEOWNERS approval plus every required check green.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
